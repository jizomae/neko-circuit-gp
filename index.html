<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="猫たちがデフォルメカートで競う、ブラウザ3Dレーシングゲーム。" />
  <title>NEKO CIRCUIT GP</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="NEKO CIRCUIT GP 3D racing game"></canvas>

    <section id="loading" class="screen active" aria-live="polite">
      <div class="loading-mark">NC</div>
      <p>サーキットを準備中…</p>
    </section>

    <section id="menu" class="screen">
      <div class="menu-panel">
        <div class="eyebrow">REAL CIRCUIT · TINY KARTS</div>
        <h1>NEKO<br><span>CIRCUIT GP</span></h1>
        <p class="lead">6匹の猫が、本気のサーキットを駆け抜ける。</p>
        <div class="cat-select" aria-label="ドライバー選択">
          <button class="cat-choice selected" data-cat="0" aria-label="ハチワレのソラを選択"><i class="cat-face sora">▲ ▲</i><b>ソラ</b><small>BALANCED</small></button>
          <button class="cat-choice" data-cat="1" aria-label="茶トラのムギを選択"><i class="cat-face mugi">▲ ▲</i><b>ムギ</b><small>SPEED</small></button>
          <button class="cat-choice" data-cat="2" aria-label="黒猫のクロを選択"><i class="cat-face kuro">▲ ▲</i><b>クロ</b><small>DRIFT</small></button>
        </div>
        <button id="start" class="start-button">RACE START <span>→</span></button>
        <div class="controls-hint">
          <span><kbd>WASD</kbd> / <kbd>矢印</kbd> 走行</span>
          <span><kbd>SPACE</kbd> ドリフト</span>
          <span><kbd>R</kbd> コース復帰</span>
        </div>
      </div>
      <div class="circuit-card">
        <span>COURSE 01</span>
        <strong>HAKUSAN SKY RING</strong>
        <div><em>3 LAPS</em><em>6 RACERS</em><em>DRY</em></div>
      </div>
    </section>

    <div id="hud" class="hidden" aria-live="polite">
      <div class="position"><strong id="position">1</strong><span>/ 6</span></div>
      <div class="lap">LAP <strong id="lap">1</strong><span>/ 3</span></div>
      <div class="time"><span>TIME</span><strong id="time">00:00.000</strong></div>
      <div class="speed"><strong id="speed">0</strong><span>km/h</span><i><b id="speedbar"></b></i></div>
      <div id="boost" class="boost">BOOST</div>
      <div id="wrong-way">WRONG WAY</div>
    </div>

    <div id="countdown" aria-live="assertive"></div>

    <section id="finish" class="screen">
      <div class="finish-panel">
        <div class="eyebrow">RACE COMPLETE</div>
        <h2 id="finish-place">1st</h2>
        <p id="finish-line">猫界最速の走り。</p>
        <div class="result-time"><span>TOTAL TIME</span><strong id="result-time">00:00.000</strong></div>
        <button id="restart" class="start-button">もう一度走る <span>↻</span></button>
      </div>
    </section>

    <div id="touch-controls" class="hidden" aria-label="タッチ操作">
      <div class="touch-steer"><button data-key="left" aria-label="左">◀</button><button data-key="right" aria-label="右">▶</button></div>
      <div class="touch-drive"><button data-key="brake" aria-label="ブレーキ">BRAKE</button><button class="gas" data-key="gas" aria-label="アクセル">GAS</button></div>
    </div>

    <button id="sound" aria-label="サウンド切替">♪</button>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
